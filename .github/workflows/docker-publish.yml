name: CI & Container Build

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Unit & Protocol Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Install FFmpeg for stream pipeline test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Formatting check
        run: cargo fmt --check

      - name: Clippy check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust test suite
        run: cargo test --verbose

  container-validation:
    name: Container & Stream Pipeline Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install FFmpeg for synthetic stream generation
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build local container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: obs-homerun:test
          cache-from: type=gha

      - name: Start obs-homerun test container
        run: |
          docker run -d --name homerun-test \
            -p 5004:5004 \
            -p 1935:1935 \
            -p 8554:8554 \
            obs-homerun:test

      - name: Verify health and discovery endpoints
        run: |
          echo "Waiting for obs-homerun to initialize..."
          for i in {1..20}; do
            if curl -s -f http://127.0.0.1:5004/discover.json > /dev/null; then
              echo "Server is responding!"
              break
            fi
            sleep 1
          done

          echo "Validating /discover.json..."
          curl -s -f http://127.0.0.1:5004/discover.json | grep "HDTV-1.0"

          echo "Validating /lineup.json..."
          curl -s -f http://127.0.0.1:5004/lineup.json | grep "1.1"

          echo "Validating /dms/device.xml..."
          curl -s -f http://127.0.0.1:5004/dms/device.xml | grep "OBS HomeRun"

          echo "Validating ConnectionManager SOAP..."
          curl -s -f -X POST http://127.0.0.1:5004/dms/ConnectionManager \
            -d '<?xml version="1.0"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body><u:GetProtocolInfo xmlns:u="urn:schemas-upnp-org:service:ConnectionManager:1"/></s:Body></s:Envelope>' \
            | grep "GetProtocolInfoResponse"

      - name: Validate live RTMP -> MediaMTX -> HTTP MPEG-TS pipeline
        run: |
          echo "Broadcasting synthetic RTMP stream into MediaMTX..."
          ffmpeg -re -f lavfi -i testsrc=size=640x360:rate=30 -f lavfi -i sine=frequency=1000:sample_rate=48000 \
            -c:v libx264 -preset ultrafast -tune zerolatency -c:a aac -t 20 -f flv rtmp://127.0.0.1:1935/live/stream > /dev/null 2>&1 &
          STREAM_PID=$!

          # Allow synthetic stream to register in MediaMTX
          sleep 5

          echo "Probing MPEG-TS stream from HTTP tuner endpoint..."
          ffmpeg -t 3 -i http://127.0.0.1:5004/auto/v1.1 -f null -
          PROBE_STATUS=$?

          kill $STREAM_PID 2>/dev/null || true

          if [ $PROBE_STATUS -ne 0 ]; then
            echo "Stream probe failed with exit code $PROBE_STATUS"
            exit $PROBE_STATUS
          fi

          echo "End-to-end stream pipeline validated successfully!"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs homerun-test

  check-version:
    name: Check Version & Release Status
    runs-on: ubuntu-latest
    needs: [test, container-validation]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      should_publish_image: ${{ steps.check.outputs.should_publish_image }}
      should_create_release: ${{ steps.check.outputs.should_create_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect version and registry status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags origin

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            IS_TAG="true"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
            TAG="v${VERSION}"
            IS_TAG="false"
          fi

          echo "Target tag: $TAG"
          echo "Target version: $VERSION"
          echo "Is tag push: $IS_TAG"

          # 1. Check if GitHub release already exists
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
            RELEASE_EXISTS="true"
          else
            echo "GitHub release $TAG does not exist."
            RELEASE_EXISTS="false"
          fi

          # 2. Check if container image already exists in GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          if docker manifest inspect "${IMAGE_LOWER}:${VERSION}" > /dev/null 2>&1 || \
             docker manifest inspect "${IMAGE_LOWER}:v${VERSION}" > /dev/null 2>&1; then
            echo "Container image for ${VERSION} already exists in ${{ env.REGISTRY }}."
            IMAGE_EXISTS="true"
          else
            echo "Container image for ${VERSION} does not exist in ${{ env.REGISTRY }}."
            IMAGE_EXISTS="false"
          fi

          # Determine whether to build & publish container image
          if [ "$IMAGE_EXISTS" = "true" ]; then
            echo "Image already exists: Skipping container build & push."
            SHOULD_PUBLISH_IMAGE="false"
          elif [ "$IS_TAG" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "New version detected on tag or dispatch: Will build and publish container image."
            SHOULD_PUBLISH_IMAGE="true"
          else
            echo "Untagged branch push: Skipping container build & push."
            SHOULD_PUBLISH_IMAGE="false"
          fi

          # Determine whether to create GitHub Release
          if [ "$RELEASE_EXISTS" = "true" ]; then
            echo "Release already exists: Skipping GitHub Release creation."
            SHOULD_CREATE_RELEASE="false"
          elif [ "$IS_TAG" = "true" ]; then
            echo "New tag detected without existing release: Will create GitHub Release."
            SHOULD_CREATE_RELEASE="true"
          else
            echo "Not a tag push: Skipping GitHub Release creation."
            SHOULD_CREATE_RELEASE="false"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_publish_image=${SHOULD_PUBLISH_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "should_create_release=${SHOULD_CREATE_RELEASE}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Multi-Arch Container
    runs-on: ubuntu-latest
    needs: [test, container-validation, check-version]
    if: needs.check-version.outputs.should_publish_image == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.check-version.outputs.tag }}
            type=semver,pattern=v{{version}},value=${{ needs.check-version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check-version.outputs.tag }}
            type=sha,format=short

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, container-validation, check-version, build-and-push]
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.container-validation.result == 'success' &&
      needs.check-version.outputs.should_create_release == 'true' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          echo "Publishing GitHub release for tag: ${TAG}"
          git fetch --tags origin
          TAG_NOTES=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)
          if [ -n "$TAG_NOTES" ]; then
            gh release create "$TAG" \
              --title "$TAG - OBS HomeRun" \
              --notes "$TAG_NOTES" \
              --generate-notes \
              --verify-tag
          else
            gh release create "$TAG" \
              --title "$TAG - OBS HomeRun" \
              --generate-notes \
              --verify-tag
          fi
