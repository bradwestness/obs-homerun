services:
  obs-homerun:
    image: ghcr.io/bradwestness/obs-homerun:latest
    container_name: obs-homerun
    network_mode: host
    restart: unless-stopped
    environment:
      - FRIENDLY_NAME=OBS HomeRun
      - CHANNEL_NUMBER=1.1
      - BUFFER_SECONDS=3.0
      # - HOST_IP=192.168.1.100  # Optional: auto-detected if omitted
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5004/discover.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
